title: P1 Meter
views:
  - title: P1 Meter
    path: p1-meter
    icon: mdi:flash
    cards:
      - type: gauge
        entity: sensor.p1_meter_p1_actual_power_consumption
        name: Pillanatnyi fogyasztás
        min: 0
        max: 5
        severity:
          green: 0
          yellow: 2
          red: 3.5
      - type: glance
        title: Állapot
        entities:
          - entity: sensor.p1_meter_p1_actual_tariff_group
            name: Aktív tarifa
          - entity: sensor.p1_meter_p1_l1_voltage
            name: Feszültség
          - entity: sensor.p1_meter_p1_l1_instant_power_current
            name: Áram
      - type: entities
        title: Tarifánkénti fogyasztás (import)
        entities:
          - entity: sensor.p1_meter_p1_consumption_tariff_1
            name: Tarifa 1
          - entity: sensor.p1_meter_p1_consumption_tariff_2
            name: Tarifa 2
          - entity: sensor.p1_meter_p1_consumption_tariff_3
            name: Tarifa 3
          - entity: sensor.p1_meter_p1_consumption_tariff_4
            name: Tarifa 4
          - type: divider
          - entity: sensor.p1_meter_p1_active_energy_import_total
            name: Összes import
          - entity: sensor.p1_meter_p1_active_energy_combined_total
            name: Kombinált (|+A|+|-A|)
      - type: entities
        title: Tarifánkénti visszatáplálás (export)
        entities:
          - entity: sensor.p1_meter_p1_return_delivery_tariff_1
            name: Tarifa 1
          - entity: sensor.p1_meter_p1_return_delivery_tariff_2
            name: Tarifa 2
          - entity: sensor.p1_meter_p1_return_delivery_tariff_3
            name: Tarifa 3
          - entity: sensor.p1_meter_p1_return_delivery_tariff_4
            name: Tarifa 4
          - type: divider
          - entity: sensor.p1_meter_p1_return_delivery_total
            name: Összes export
      - type: entities
        title: Pillanatnyi értékek (L1)
        entities:
          - entity: sensor.p1_meter_p1_l1_instant_power_usage
            name: Import teljesítmény
          - entity: sensor.p1_meter_p1_l1_instant_power_return
            name: Export teljesítmény
          - entity: sensor.p1_meter_p1_l1_instant_power_current
            name: Áram
          - entity: sensor.p1_meter_p1_l1_voltage
            name: Feszültség
      - type: entities
        title: Meddő energia
        entities:
          - entity: sensor.p1_meter_p1_reactive_energy_import_total
            name: Import összesen
          - entity: sensor.p1_meter_p1_reactive_energy_export_total
            name: Export összesen
          - type: divider
          - entity: sensor.p1_meter_p1_reactive_energy_qi
            name: QI (induktív)
          - entity: sensor.p1_meter_p1_reactive_energy_qii
            name: QII (kapacitív)
          - entity: sensor.p1_meter_p1_reactive_energy_qiii
            name: QIII (induktív)
          - entity: sensor.p1_meter_p1_reactive_energy_qiv
            name: QIV (kapacitív)
      - type: history-graph
        entities:
          - entity: sensor.p1_meter_p1_l1_instant_power_usage
            name: Import
          - entity: sensor.p1_meter_p1_l1_instant_power_return
            name: Export
        title: Teljesítmény (24 óra)
        hours_to_show: 24
      - type: history-graph
        entities:
          - entity: sensor.p1_meter_p1_l1_voltage
        title: Feszültség (24 óra)
        hours_to_show: 24
      - type: history-graph
        title: D tarifa ár (24 óra)
        hours_to_show: 24
        entities:
          - entity: sensor.udvar_mvm_next_energy_import_mvm_next_d_tarifa_aktualis_ar
          - entity: >-
              sensor.udvar_mvm_next_energy_import_mvm_next_d_tarifa_hupx_nyers_ar
      - type: statistics-graph
        entities:
          - sensor.p1_meter_p1_active_energy_import_total
        title: Napi fogyasztás
        period: day
        chart_type: bar
        stat_types:
          - change
